name = "go"  # 주소 맨 앞: https://go.<계정 이름>.workers.dev
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true    # https://vector-raiders.<계정>.workers.dev 주소로 연다
preview_urls = false  # 버전마다 따로 생기는 미리보기 주소는 쓰지 않는다

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 문항 세트(content/sets/*.md)를 글자 그대로 서버 코드에 넣는다 (정답이 학생 화면 파일로 나가지 않게)
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
