<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벡터 유적 탈출 · 기하 방탈출</title>
  <meta name="description" content="상자를 열고 벡터 문제를 풀어 잊힌 유적을 탈출하는 3D 기하 방탈출 게임. 혼자 연습하거나 반 친구들과 함께 유물을 깨워요.">
  <!-- 링크를 붙였을 때 보이는 미리보기(카카오톡, 밴드, 페이스북 등) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="벡터 유적 탈출">
  <meta property="og:title" content="벡터 유적 탈출 · 기하 방탈출">
  <meta property="og:description" content="상자를 열고 벡터 문제를 풀어 잊힌 유적을 탈출하세요! 혼자 연습하거나 반 친구들과 함께 유물을 깨워요.">
  <meta property="og:url" content="https://go.geomath.workers.dev/">
  <meta property="og:image" content="https://go.geomath.workers.dev/og-image.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="420">
  <meta property="og:image:alt" content="기하 기호가 쏟아지는 유적을 달리는 탐험가들과 '벡터 유적 탈출' 제목">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="벡터 유적 탈출 · 기하 방탈출">
  <meta name="twitter:description" content="상자를 열고 벡터 문제를 풀어 잊힌 유적을 탈출하세요!">
  <meta name="twitter:image" content="https://go.geomath.workers.dev/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // 수식은 MathJax로 조판한다. \vv{a}: 벡터 a, \VV{AB}: 벡터 AB
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"]], macros: { vv: ["\\overrightarrow{#1}", 1], VV: ["\\overrightarrow{\\mathrm{#1}}", 1] } },
      chtml: { fontURL: "/vendor/mathjax/output/chtml/fonts/woff-v2" },
      startup: { typeset: false },
    };
  </script>
  <script defer src="/vendor/mathjax/tex-chtml.js"></script>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
</head>
<body class="student">
  <section id="join" class="intro">
    <canvas id="rain" class="rain" aria-hidden="true"></canvas>
    <canvas id="stage" class="stage3d" aria-hidden="true"></canvas>

    <!-- 타이틀: TOUCH TO START -->
    <div id="splash" class="splash">
      <div class="title-block">
        <span class="title-tag">기하 방탈출</span>
        <h1 class="game-title"><span class="t1">벡터</span><span class="t2">유적 탈출</span></h1>
      </div>
      <button id="touch" class="touch-btn" type="button">TOUCH TO START</button>
      <p class="credit">기하 Ⅲ-1 · 벡터의 연산</p>
    </div>

    <!-- 메뉴: 카드 세 장 -->
    <div id="menu" class="menu" hidden>
      <h1 class="menu-title">벡터 유적 탈출</h1>
      <div class="cards">
        <button class="mcard practice" type="button" data-mode="practice">
          <span class="art"><img id="art-practice" alt=""></span>
          <span class="label"><b>연습 모드</b><small>혼자 언제든 · 기록은 나만 봐요</small></span>
        </button>
        <button class="mcard class" type="button" data-mode="class">
          <span class="art"><img id="art-class" alt=""></span>
          <span class="label"><b>수업 참가</b><small>선생님이 연 탐험에 반 친구들과 함께</small></span>
        </button>
        <button class="mcard settings" type="button" id="open-settings">
          <span class="art gear" aria-hidden="true">⚙</span>
          <span class="label"><b>설정</b><small>그래픽 · 배경음</small></span>
        </button>
      </div>
      <p id="join-error" class="error menu-error" role="alert"></p>
    </div>

    <!-- 이름 적기 -->
    <form id="join-form" class="sheet" autocomplete="off" hidden>
      <h2 id="sheet-title"></h2>
      <p id="sheet-lead" class="muted"></p>
      <label>이름<input id="join-name" maxlength="12" placeholder="예: 5번 홍길동" required></label>
      <div class="sheet-buttons">
        <button id="sheet-back" class="btn" type="button">← 뒤로</button>
        <button class="btn primary big" type="submit">탐험 시작</button>
      </div>
      <button id="start-btn" class="link-btn" type="button" hidden>🔑 선생님: 수업 탐험 시작</button>
    </form>

    <!-- 설정 -->
    <div id="settings-sheet" class="sheet" hidden>
      <h2>설정</h2>
      <div class="setting-row"><span>🎵 배경음악</span><button class="toggle" type="button" data-key="music"></button></div>
      <div class="setting-row"><span>🔔 효과음 · 타자 소리</span><button class="toggle" type="button" data-key="sfx"></button></div>
      <div class="setting-row"><span>🖥️ 그래픽 품질</span><button class="toggle" type="button" data-key="quality"></button></div>
      <p class="muted small">크롬북에서 화면이 끊기면 그래픽 품질을 '낮음'으로 바꿔 보세요.</p>
      <div class="sheet-buttons"><button id="settings-close" class="btn primary" type="button">닫기</button></div>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <header class="topbar">
      <div class="brand">🏺 벡터 유적 탈출</div>
      <div class="meta">
        <span id="stage-chip" class="chip"></span>
        <span id="online-chip" class="chip soft"></span>
        <span id="mode-chip" class="chip soft"></span>
        <span id="me-chip" class="chip soft"></span>
      </div>
    </header>
    <div id="conn" class="conn" hidden>연결이 끊겼어요. 다시 연결하는 중…</div>
    <div class="world-wrap">
      <canvas id="world" tabindex="0" aria-label="유적 지도. 방향키나 WASD로 움직이고 E로 열어요."></canvas>
      <div class="hud">
        <div class="hud-card">
          <b id="hud-room"></b>
          <span id="hud-keys" title="열쇠 조각 (푼 문제)"></span>
          <span id="hud-jumps" title="벡터 점프 (건넌 장애물)"></span>
          <button id="sound-btn" class="hud-btn" type="button" aria-label="소리 끄기 (M)">🔊</button>
          <button id="restart-btn" class="hud-btn" type="button" hidden>↺ 처음부터</button>
        </div>
        <div class="hud-right">
          <div class="hud-card hud-relics" id="hud-relics" title="우리 반 유물"></div>
          <ol id="hud-rank" class="hud-card hud-rank" aria-label="실시간 랭킹"></ol>
        </div>
      </div>
      <div id="popups" class="popups" aria-live="polite"></div>
      <div id="banner" class="banner" hidden></div>
      <div id="loading" class="loading" hidden>🏺 유적을 불러오는 중…</div>
      <div class="help">WASD·방향키 이동 · <kbd>E</kbd> 또는 클릭: 열기 · <kbd>M</kbd> 소리</div>
    </div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <button id="modal-close" class="modal-close" type="button" aria-label="닫기">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/js/student.js"></script>
</body>
</html>
